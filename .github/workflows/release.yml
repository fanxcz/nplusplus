name: Release N++

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: npp-linux-x86_64.tar.gz
          - os: windows-latest
            asset: npp-windows-x86_64.zip
          - os: macos-latest
            asset: npp-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang lld

      - name: Install Windows toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ninja llvm -y --no-progress

      - name: Install macOS toolchain
        if: runner.os == 'macOS'
        run: brew install ninja llvm

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNPP_BUILD_TESTS=OFF

      - name: Build compiler
        run: cmake --build build --target npp

      - name: Verify version
        shell: pwsh
        run: |
          $exe = if ($IsWindows) { './build/npp.exe' } else { './build/npp' }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw 'npp --version failed' }

      - name: Install into staging prefix
        run: cmake --install build --prefix dist

      - name: Smoke test staged binary
        shell: pwsh
        run: |
          $exe = if ($IsWindows) { './dist/bin/npp.exe' } else { './dist/bin/npp' }
          & $exe self-test
          if ($LASTEXITCODE -ne 0) { throw 'staged npp self-test failed' }

      - name: Package archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = '${{ matrix.asset }}'
          if ($asset.EndsWith('.zip')) {
            Compress-Archive -Path 'dist/*' -DestinationPath $asset
          } else {
            tar -czf $asset -C dist .
          }
          $hash = (Get-FileHash -Algorithm SHA256 -Path $asset).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -Path "$asset.sha256" -Encoding ASCII
          Get-Item $asset, "$asset.sha256" | Format-Table Name, Length

      - name: Build NSIS installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'choco install nsis failed' }
          # Locate makensis.exe: choco/NSIS layouts vary (NSIS\Bin, C:\tools, ...).
          $makensis = (Get-ChildItem 'C:\Program Files (x86)\NSIS', 'C:\Program Files\NSIS', 'C:\tools' `
            -Recurse -Filter makensis.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1).FullName
          if (-not $makensis) {
            $makensis = (Get-ChildItem 'C:\' -Recurse -Depth 4 -Filter makensis.exe `
              -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          if (-not $makensis) { throw 'makensis.exe not found after choco install nsis' }
          $version = (Select-String -Path 'CMakeLists.txt' -Pattern 'VERSION ([0-9]+[.][0-9]+[.][0-9]+)').Matches[0].Groups[1].Value
          # NSIS resolves File paths relative to the script; pass an absolute stage dir.
          $dist = Join-Path (Get-Location).Path 'dist'
          & $makensis "/DNPP_VERSION=$version" "/DDIST_DIR=$dist" scripts/npp-setup.nsi
          if ($LASTEXITCODE -ne 0) { throw 'makensis failed' }
          # makensis writes OutFile relative to scripts/; move artifacts up.
          Get-ChildItem scripts -Filter "npp-setup-*-windows-x86_64.exe*" | Move-Item -Destination .
          $installer = Get-Item "npp-setup-$version-windows-x86_64.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -Path $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Path "$($installer.Name).sha256" -Encoding ASCII
          Get-Item $installer.FullName, "$($installer.Name).sha256" | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: npp-windows-installer
          path: |
            npp-setup-*-windows-x86_64.exe
            npp-setup-*-windows-x86_64.exe.sha256
          if-no-files-found: error
          retention-days: 30

  studio:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build N++ Studio installer
        working-directory: apps/studio
        run: |
          npm ci --no-audit --no-fund
          npm run dist:win
      - name: Checksums for Studio installers
        shell: pwsh
        working-directory: apps/studio
        run: |
          Get-ChildItem -Path 'release' -Filter '*.exe' -File | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -Path "$($_.FullName).sha256" -Encoding ASCII
          }
      - uses: actions/upload-artifact@v4
        with:
          name: npp-studio-windows
          path: apps/studio/release/*.exe*
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [build, studio]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          gh release view "$tag" >/dev/null 2>&1 && exists=1 || exists=0
          notes="Automated build of N++ ${tag}. Archives contain the \`npp\` compiler plus the runtime, standard library and project templates under \`share/npp/\`. Verify \`.sha256\` sidecars after download; \`scripts/install.sh\` and \`scripts/install.ps1\` automate install and verification."
          if [ "$exists" = "1" ]; then
            gh release upload "$tag" artifacts/* --clobber
          else
            gh release create "$tag" artifacts/* --title "N++ ${tag}" --notes "$notes"
          fi
